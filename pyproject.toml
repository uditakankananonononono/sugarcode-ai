[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sugarcode-ai"
version = "0.2.0"
description = "SugarCode AI - Omega OS v7.0 multi-omic bio-design platform"
readme = "README.md"
license = {text = "Proprietary"}
authors = [{name = "Udita Phookan"}]
keywords = ["genomics", "splice", "bio-design", "multi-omics", "clinical-variant-interpretation"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "fastapi>=0.100", "pydantic>=2"]

[project.scripts]
sugarcode = "sugarcode.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "cryptography>=41"]
vault = ["cryptography>=41"]
local = ["transformers>=4.40", "torch>=2.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
"sugarcode.bio" = ["data/**/*"]
"sugarcode.llm" = ["data/*"]
"sugarcode.modules" = ["**/*.json", "**/*.csv", "**/*.txt", "**/*.md", "**/*.npy", "**/*.tsv", "**/*.yaml"]

